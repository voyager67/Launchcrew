name: Validate LaunchCrew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skills, agents, docs, and bundle metadata
        run: python scripts/validate_project.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild ChatGPT skill bundles
        run: python scripts/package_chatgpt_skills.py --check
