name: Validate LaunchCrew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launchcrew-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skills, agents, docs, and community configuration
        run: python scripts/validate_project.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Codex skill installer
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf "$sandbox"' EXIT

          mkdir "$sandbox/project"
          ./scripts/install.sh --project "$sandbox/project"
          project_count="$(find "$sandbox/project/.agents/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"
          test "$project_count" -eq 23

          if ./scripts/install.sh --project "$sandbox/project"; then
            echo "Installer unexpectedly overwrote existing skills." >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi

          CODEX_HOME="$sandbox/codex" ./scripts/install.sh --global
          global_count="$(find "$sandbox/codex/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"
          test "$global_count" -eq 23
      - name: Verify ChatGPT skill bundles
        run: python scripts/package_chatgpt_skills.py --check
      - name: Create source snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".")
          output = Path("/tmp/launchcrew-source.zip")
          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  if ".git" in path.parts or "__pycache__" in path.parts:
                      continue
                  if path.suffix in {".pyc", ".pyo"} or path.name == ".DS_Store":
                      continue
                  archive.write(path, (Path("LaunchCrew") / path).as_posix())
          print(f"Created {output} ({output.stat().st_size} bytes)")
          PY
      - name: Upload source snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: launchcrew-source-${{ github.sha }}
          path: /tmp/launchcrew-source.zip
          if-no-files-found: error
          retention-days: 14
