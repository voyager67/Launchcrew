name: Feature request
description: Propose a workflow improvement grounded in a real user problem.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include confidential prompts, code, or user data."
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended user
      description: What are you trying to accomplish, and who is affected?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or example workflow
      description: Describe when this happens, how often, and what the current workaround costs.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success rather than prescribing only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: constraints
    attributes:
      label: Compatibility, privacy, and safety constraints
      description: Note any Codex / ChatGPT differences or security implications.
    validations:
      required: false
