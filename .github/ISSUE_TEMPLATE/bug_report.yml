name: Bug report
description: Report a reproducible problem in a skill, installer, validator, or bundle.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Please do not include secrets, private code, or confidential user data."
  - type: input
    id: version
    attributes:
      label: LaunchCrew version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Codex CLI
        - ChatGPT Skills
        - ChatGPT Projects fallback
        - Install script
        - Packaging / validation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include exact commands and sanitized input where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
    validations:
      required: true
