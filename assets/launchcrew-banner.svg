    <text x="76" y="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#c4b5fd">THE OPEN-SOURCE AI WORKFLOW KIT</text>
    <text x="76" y="73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">LaunchCrew</text>
    <text x="78" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#cbd5e1">Turn Codex CLI into a focused product team.</text>
    <text x="78" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="1.3" fill="#5eead4">SPECIFY  ·  DELEGATE  ·  VERIFY  ·  SHIP</text>
  </g>
  <g transform="translate(745 70)">
