    <path d="M382 85l12 9-12 9" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
