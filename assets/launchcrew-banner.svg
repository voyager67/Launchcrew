        <text x="46" y="36" font-size="14" font-weight="700" fill="#c4b5fd">01</text>
        <text x="46" y="59" font-size="13" font-weight="600" fill="#f8fafc">SPECIFY</text>
      </g>
      <g transform="translate(112 50)">
        <rect x="0" y="0" width="92" height="88" rx="16" fill="#17223d" stroke="#818cf8" stroke-opacity=".8"/>
        <text x="46" y="36" font-size="14" font-weight="700" fill="#a5b4fc">02</text>
        <text x="46" y="59" font-size="13" font-weight="600" fill="#f8fafc">BUILD</text>
      </g>
      <g transform="translate(224 50)">
